version: "3.9"
 
services:
  eprints:
    build: .
    container_name: eprints
    ports:
      - "${EPRINTS_HOST_PORT:-8080}:80"
    environment:
      EPRINTS_ARCHIVE_ID: repo
      EPRINTS_HOSTNAME: ${EPRINTS_HOSTNAME:-repo.example.com}
      EPRINTS_ADMIN_EMAIL: ${EPRINTS_ADMIN_EMAIL:-admin@example.com}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - /var/eprints:/opt/eprints3/archives
    restart: unless-stopped
    networks: 
      - bridge  